name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source and deployment closure
        run: node scripts/validate-project.mjs

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js ascm-import.js catalog-data.js pptx-pagination.js _site/
          cp -R assets vendor _site/

          for required_path in index.html styles.css app.js ascm-import.js catalog-data.js pptx-pagination.js assets vendor; do
            test -e "_site/${required_path}"
          done
          test ! -e _site/project-data/private

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
