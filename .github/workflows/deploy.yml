name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source and deployment closure
        run: |
          npm run check
          node scripts/build-supabase-master.mjs --check
          node scripts/checks/hosted-package.mjs --required --deployment-only

      - name: Prepare static site
        env:
          PPC_PACKAGE_ENDPOINT: ${{ vars.PPC_PACKAGE_ENDPOINT }}
          PPC_MASTER_ENDPOINT: ${{ vars.PPC_MASTER_MODE == 'service' && vars.PPC_MASTER_ENDPOINT || '' }}
          PPC_MASTER_MODE: ${{ vars.PPC_MASTER_MODE }}
          PPC_SITE_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p _site/css _site/js _site/data
          cp public/index.html _site/
          cp public/css/styles.css public/css/workspace-notifications.css public/css/product-issues.css public/css/product-merge.css public/css/portfolio-search.css _site/css/
          cp public/js/workspace-notifications.js public/js/product-issues.js public/js/product-merge.js public/js/product-merge-ui.js _site/js/
          cp public/js/portfolio-search.js public/js/portfolio-search-ui.js _site/js/
          cp public/js/date-history.js public/js/date-precision.js _site/js/
          cp public/css/date-history.css _site/css/
          cp public/js/plc-import.js public/js/plc-import-ui.js _site/js/
          cp public/css/plc-import.css _site/css/
          cp public/js/app.js public/js/app-dialogs.js public/js/workspace-ui.js public/js/portfolio-model.js public/js/master-model.js public/js/master-github.js public/js/master-client.js public/js/master-ui.js public/js/master-presence.js public/js/roadmap-interaction.js public/js/product-details.js public/js/ascm-import.js public/js/catalog-data.js public/js/pptx-pagination.js public/js/pptx-editable.js public/js/package-codec.js public/js/package-source.js public/js/package-client.js public/js/package-ui.js _site/js/
          node scripts/configure-package-source.mjs
          node scripts/configure-site-version.mjs
          cp public/data/master_ppc.pkg _site/data/
          cp -R public/assets public/vendor _site/

          for required_path in index.html css/styles.css css/workspace-notifications.css css/product-issues.css css/product-merge.css css/portfolio-search.css js/portfolio-search.js js/portfolio-search-ui.js js/product-merge.js js/product-merge-ui.js js/workspace-notifications.js js/product-issues.js js/app.js js/app-dialogs.js js/workspace-ui.js js/portfolio-model.js js/master-model.js js/master-github.js js/master-client.js js/master-ui.js js/master-presence.js js/roadmap-interaction.js js/product-details.js js/ascm-import.js js/catalog-data.js js/pptx-pagination.js js/pptx-editable.js js/package-codec.js js/package-source.js js/package-client.js js/package-ui.js assets vendor; do
            test -e "_site/${required_path}"
          done
          test ! -e _site/project-data/private
          test ! -e _site/docs
          test ! -e _site/artifacts
          test ! -e _site/scripts
          test ! -e _site/server
          test -f _site/data/master_ppc.pkg
          test -f _site/js/date-history.js
          test -f _site/js/date-precision.js
          test -f _site/css/date-history.css
          test -f _site/js/plc-import.js
          test -f _site/js/plc-import-ui.js
          test -f _site/css/plc-import.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
