name: Publish encrypted shared master

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Initialize the empty shared master from the current GitHub package
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: ppc-master-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.PPC_MASTER_ENDPOINT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PPC_MASTER_ENDPOINT: ${{ vars.PPC_MASTER_ENDPOINT }}
      PPC_PUBLISHER_SECRET: ${{ secrets.PPC_PUBLISHER_SECRET }}
      PPC_PACKAGE_KEY: ${{ secrets.PPC_PACKAGE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Initialize shared master when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        run: node scripts/publish-supabase-master.mjs --bootstrap
      - name: Publish accepted changes and request Pages deployment
        run: node scripts/publish-supabase-master.mjs
