project_id = "PPCDB"

[functions.ppc-master]
verify_jwt = false
entrypoint = "./functions/ppc-master/index.ts"

# OAuth discovery is public; the function verifies its exact owner/client JWT.
# With its default environment the entire MCP resource remains disabled.
[functions.ppc-ascm-mcp]
verify_jwt = false
entrypoint = "./functions/ppc-ascm-mcp/index.ts"

# Explicit publisher-secret/reader-key verification; all delivery paths default off.
[functions.ppc-package]
verify_jwt = false
entrypoint = "./functions/ppc-package/index.ts"

# Dedicated server-only worker-secret verification; missing configuration is 404.
[functions.ppc-ascm-flow]
verify_jwt = false
entrypoint = "./functions/ppc-ascm-flow/index.ts"

